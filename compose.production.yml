name: civicforge-production

services:
  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_CA_CERT_FILE: /run/secrets/supabase_ca_cert
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      FILE_SIGNING_SECRET_FILE: /run/secrets/file_signing_secret
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      LOG_SINK_URL_FILE: /run/secrets/log_sink_url
      LOG_SINK_TOKEN_FILE: /run/secrets/log_sink_token
      AI_API_KEY_FILE: /run/secrets/ai_api_key
      PRIVATE_UPLOAD_DIR: /data/uploads
      BACKUP_STATE_DIR: /backup-state
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the public HTTPS origin}
      DEMO_ENV: ${DEMO_ENV:-false}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      REQUIRE_POSTGRES: "true"
      REQUIRE_DATABASE_TLS: "true"
      REQUIRE_MALWARE_SCANNER: "true"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
    secrets:
      - database_url
      - supabase_ca_cert
      - jwt_secret
      - file_signing_secret
      - metrics_token
      - log_sink_url
      - log_sink_token
      - ai_api_key
    depends_on:
      clamav:
        condition: service_healthy
    volumes:
      - civicforge_uploads:/data/uploads
      - civicforge_backup_state:/backup-state:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  clamav:
    image: clamav/clamav-debian:stable
    volumes:
      - civicforge_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 2 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - civicforge_caddy_data:/data
      - civicforge_caddy_config:/config
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - civicforge_prometheus:/prometheus
    secrets:
      - metrics_token
    depends_on:
      - api
      - alertmanager
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - civicforge_alertmanager:/alertmanager
    secrets:
      - alert_webhook_url
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backup:
    build:
      context: ./ops/backup
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY to off-host storage}
      PGSSLROOTCERT: /run/secrets/supabase_ca_cert
      PGSSLMODE: verify-full
      DATABASE_CA_CERT_FILE: /run/secrets/supabase_ca_cert
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_HOST_NAME: ${DOMAIN:?Set DOMAIN}
    secrets:
      - database_url
      - supabase_ca_cert
      - restic_password
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - civicforge_uploads:/data/uploads:ro
      - civicforge_backup_state:/backup-state
      - civicforge_restic_cache:/restic-cache
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  restore-drill:
    profiles: ["restore-drill"]
    build:
      context: ./ops/backup
    entrypoint: ["/usr/local/bin/restore-drill.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY to off-host storage}
      PGSSLROOTCERT: /run/secrets/supabase_ca_cert
      PGSSLMODE: verify-full
      DATABASE_CA_CERT_FILE: /run/secrets/supabase_ca_cert
    secrets:
      - database_url
      - restore_database_url
      - supabase_ca_cert
      - restic_password
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - civicforge_restic_cache:/restic-cache
    security_opt:
      - no-new-privileges:true

secrets:
  database_url:
    file: ${SECRETS_DIR:-./.secrets}/database_url
  supabase_ca_cert:
    file: ${SECRETS_DIR:-./.secrets}/supabase-ca.crt
  restore_database_url:
    file: ${SECRETS_DIR:-./.secrets}/restore_database_url
  jwt_secret:
    file: ${SECRETS_DIR:-./.secrets}/jwt_secret
  file_signing_secret:
    file: ${SECRETS_DIR:-./.secrets}/file_signing_secret
  metrics_token:
    file: ${SECRETS_DIR:-./.secrets}/metrics_token
  log_sink_url:
    file: ${SECRETS_DIR:-./.secrets}/log_sink_url
  log_sink_token:
    file: ${SECRETS_DIR:-./.secrets}/log_sink_token
  ai_api_key:
    file: ${SECRETS_DIR:-./.secrets}/ai_api_key
  restic_password:
    file: ${SECRETS_DIR:-./.secrets}/restic_password
  s3_access_key_id:
    file: ${SECRETS_DIR:-./.secrets}/s3_access_key_id
  s3_secret_access_key:
    file: ${SECRETS_DIR:-./.secrets}/s3_secret_access_key
  alert_webhook_url:
    file: ${SECRETS_DIR:-./.secrets}/alert_webhook_url

volumes:
  civicforge_uploads:
  civicforge_clamav:
  civicforge_caddy_data:
  civicforge_caddy_config:
  civicforge_prometheus:
  civicforge_alertmanager:
  civicforge_backup_state:
  civicforge_restic_cache:
