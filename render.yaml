# CivicForge FREE DEMO deployment for Render.
# This file intentionally creates ONLY a Free Web Service.
# It is for synthetic/demo data, not real citizen records.
services:
  - type: web
    name: civicforge-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: off
    healthCheckPath: /api/health/ready
    envVars:
      - fromGroup: civicforge-render-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DEMO_ENV
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: REQUIRE_DATABASE_TLS
        value: "true"
      - key: REQUIRE_MALWARE_SCANNER
        value: "false"
      - key: MALWARE_SCAN_MODE
        value: basic
      - key: DATABASE_URL_FILE
        value: /etc/secrets/database_url
      - key: DATABASE_CA_CERT_FILE
        value: /etc/secrets/supabase-ca.crt
      - key: PGSSLROOTCERT
        value: /etc/secrets/supabase-ca.crt
      - key: PGSSLMODE
        value: verify-full
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: PRIVATE_UPLOAD_DIR
        value: /tmp/civicforge-uploads
      - key: SECRETS_DIR
        value: /etc/secrets
      # No Render private service, persistent disk, Caddy, Prometheus,
      # Alertmanager, Restic worker, or paid-only resource is declared here.
